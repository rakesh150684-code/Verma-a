<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10182b"><title>VERMA AI</title><link rel="stylesheet" href="/style.css">
</head>
<body><main class="app">
<header><div class="logo">V</div><div><h1>VERMA AI</h1><p>Ask anything. Learn everything.</p></div><span id="status">जाँच हो रही है…</span></header>
<div class="intro"><b>नमस्ते! मैं VERMA AI हूँ।</b><p>विज्ञान, पढ़ाई, तकनीक और सामान्य ज्ञान—कुछ भी पूछिए।</p>
<div class="chips"><button type="button" data-q="प्रकाश संश्लेषण क्या है? आसान भाषा में समझाओ।">विज्ञान</button><button type="button" data-q="न्यूटन के गति के तीन नियम उदाहरण सहित समझाओ।">भौतिक विज्ञान</button><button type="button" data-q="कृत्रिम बुद्धिमत्ता क्या है?">AI क्या है?</button></div></div>
<section id="chat" aria-live="polite"></section>
<form id="form"><textarea id="message" rows="1" maxlength="12000" placeholder="अपना सवाल लिखें…" required></textarea><button id="send" type="submit">भेजें</button></form>
<footer>VERMA AI · सीखने और जानकारी के लिए</footer>
</main><script src="/app.js"></script></body></html>
